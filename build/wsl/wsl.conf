# Пусковой дистрибутив lolssd (docs/ARCHITECTURE.md §6).
[boot]
# systemd как PID 1: с ним systemd-nspawn получает делегированные cgroups.
systemd=true

[user]
default=root

[automount]
# /mnt/c нужен: оттуда читается активный профиль и monitors.json.
enabled=true

[interop]
enabled=true
appendWindowsPath=false
